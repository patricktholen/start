<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Cloud Dashboard</title>
    <style>
        :root { --bg: #202124; --text: #e8eaed; --accent: #8ab4f8; }
        body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; padding: 40px; }
        
        .search-bar { width: 500px; padding: 12px 24px; border-radius: 24px; border: 1px solid #5f6368; background: transparent; color: white; margin-bottom: 50px; outline: none; transition: 0.2s; }
        .search-bar:focus { border-color: var(--accent); background: #303134; }

        .container { width: 90%; max-width: 900px; }
        .category-section { margin-bottom: 40px; }
        .category-title { font-size: 18px; color: var(--accent); margin-bottom: 15px; border-bottom: 1px solid #3c4043; padding-bottom: 8px; }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 15px; }
        
        .shortcut { text-decoration: none; color: inherit; display: flex; flex-direction: column; align-items: center; padding: 12px; border-radius: 8px; transition: 0.2s; }
        .shortcut:hover { background: rgba(255,255,255,0.08); }

        .icon-wrapper { width: 48px; height: 48px; background: white; border-radius: 12px; display: flex; align-items: center; justify-content: center; margin-bottom: 10px; }
        .icon-wrapper img { width: 28px; height: 28px; }
        
        .label { font-size: 12px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%; }
    </style>
</head>
<body>

    <form action="https://www.google.com/search" method="GET">
        <input type="text" name="q" class="search-bar" placeholder="Search Google..." autocomplete="off">
    </form>

    <div id="main-container" class="container"></div>

    <script>
        async function loadLinks() {
            const response = await fetch('links.json');
            const data = await response.json();
            const container = document.getElementById('main-container');

            for (const [category, links] of Object.entries(data)) {
                // Create Category Section
                const section = document.createElement('div');
                section.className = 'category-section';
                section.innerHTML = `<div class="category-title">${category}</div>`;
                
                const grid = document.createElement('div');
                grid.className = 'grid';

                links.forEach(link => {
                    const domain = new URL(link.url).hostname;
                    const el = document.createElement('a');
                    el.className = 'shortcut';
                    el.href = link.url;
                    el.innerHTML = `
                        <div class="icon-wrapper">
                            <img src="https://www.google.com/s2/favicons?sz=64&domain=${domain}" alt="">
                        </div>
                        <div class="label">${link.name}</div>
                    `;
                    grid.appendChild(el);
                });

                section.appendChild(grid);
                container.appendChild(section);
            }
        }

        loadLinks();
    </script>
</body>
</html>
